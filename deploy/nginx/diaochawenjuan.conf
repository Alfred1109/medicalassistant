# /etc/nginx/sites-available/diaochawenjuan
# Reverse proxy for the diaochawenjuan Flask app on :80 (HTTP).
# Hardcoded upstream 127.0.0.1:5001 — port switch is driven by start/stop.sh,
# not by cookie. Edit the proxy_pass line below when changing environments.
#
# Also serves medicalassistant (React + FastAPI) under the /medical prefix:
#   /medical/api/...  ->  127.0.0.1:5502/api/...  (FastAPI)
#   /medical/ws/...   ->  127.0.0.1:5502/ws/...   (FastAPI WebSocket)
#   /medical/...      ->  127.0.0.1:5501/medical/... (Vite dev server, base=/medical/)
# The prefix must match VITE_API_PREFIX in frontend/.env.local.

# Long upload support for questionnaire imports: keep this in the http{} context
# as well, in case /icf/ ever comes back online.
client_max_body_size 32m;

# WebSocket 升级支持(Vite HMR 与 FastAPI /ws/chat 共用)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

# Optional Medicf ICF sub-app, kept for parity with deploy/nginx/default.d.
    # Currently disabled: requires a separate Medicf instance on :3000.
    # location = /icf { return 301 /icf/; }
    # location /icf/ { ... }

    location / {
        client_max_body_size 32m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://127.0.0.1:5001;
    }


   location ^~ /kf/static/ {
    client_max_body_size 32m;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /kf;
    proxy_pass http://127.0.0.1:6001/static/;
    # 浏览器缓存 7 天
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    # 可选：让中间代理也可缓存
    # proxy_ignore_headers Cache-Control Set-Cookie;
    # proxy_hide_header Set-Cookie;
  }


   location  ^~ /kf/ {
        client_max_body_size 32m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Prefix /kf;
        proxy_pass http://127.0.0.1:6001/;
    }


# ---------------- medicalassistant ----------------

# 无尾斜杠时补上,避免落到 location / (newcrf)
location = /medical {
    return 301 /medical/;
}

# 前端 API:剥掉 /medical 前缀后转给 FastAPI(后端路由本身带 /api)
location ^~ /medical/api/ {
    rewrite ^/medical/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5502;
    client_max_body_size 32m;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# WebSocket:后端路由为 /ws/chat/{conversation_id}
location ^~ /medical/ws/ {
    rewrite ^/medical/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5502;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# 前端:保留 /medical 前缀原样交给 Vite(dev server 的 base 就是 /medical/)
# 注意:这里不能用 ^~,否则下面的正则 location 永远不会生效
location /medical/ {
    proxy_pass http://127.0.0.1:5501;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# FastAPI 的接口文档在根路径下(/docs、/openapi.json),不在 /api 之下
location ~ ^/medical/(docs|openapi\.json|redoc)$ {
    rewrite ^/medical/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5502;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}


}
